global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: netcapacity
    env: teste

scrape_configs:
  # O próprio Prometheus
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Instância EC2: CPU, memória, disco, rede
  - job_name: ec2-node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels: {instance: netcapacity-app}

  # Containers: CPU, memória, rede e reinícios de cada serviço
  - job_name: containers
    static_configs:
      - targets: ["cadvisor:8080"]

  # RabbitMQ: mensagens na fila, taxa de publicação/entrega, consumidores
  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    static_configs:
      - targets: ["rabbitmq:15692"]

  # API FastAPI: requisições, latência, erros (precisa do /metrics na API)
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
