# Datasources criados automaticamente quando o Grafana sobe.
apiVersion: 1

datasources:
  # Métricas técnicas (EC2, containers, RabbitMQ, API)
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  # Métricas de negócio: utilização dos uplinks, GPON x HFC, alertas
  - name: NetCapacity-RDS
    uid: rds
    type: postgres
    url: ${RDS_HOST}:5432
    user: ${RDS_USER}
    jsonData:
      database: netcapacity
      sslmode: require          # RDS PostgreSQL 16 exige SSL
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: ${RDS_PASSWORD}

  # Serviços gerenciados da AWS (RDS, Lambda, EC2) via CloudWatch,
  # usando a role da instância (LabInstanceProfile)
  - name: CloudWatch
    uid: cloudwatch
    type: cloudwatch
    jsonData:
      authType: default
      defaultRegion: ${AWS_REGION}
